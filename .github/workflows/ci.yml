name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits to scan them, which needs
  # this; without it every pull_request run of the secrets job fails with a 403.
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The runner's system Python is externally managed (PEP 668), so install
      # into a venv and put it on PATH for the steps that follow.
      - name: Install
        run: |
          # The locked versions, so a new release of a dependency cannot change a result
          # or break the build without a commit that says so (`uv lock --upgrade` to move).
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy src/jevbench

      - name: Tests
        run: pytest tests -q --cov=jevbench --cov-report=term-missing

      # The whole pipeline must work with no API key at all. This runs the
      # battery against the offline simulator and analyses the result, which
      # catches breakage in the runner and analysis layers that unit tests miss.
      - name: End-to-end pipeline (offline, no key)
        run: |
          jevbench probes
          jevbench doctor --backend simulator
          jevbench run --backend simulator --replicates 2 --workers 4
          jevbench analyse
          jevbench figures
          python scripts/check_figure_layout.py

      - name: Upload offline artefacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-pipeline-output
          path: |
            results/simulated/tables/
            results/simulated/figures/
          if-no-files-found: error

  # The committed tables and comparison must be what the committed raw records
  # give. Run without the replicate intervals (a slow resampling step whose file
  # is left out of the comparison), so a changed statistic, a changed loader or a
  # raw file edited without regenerating shows up as a diff.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Rebuild the committed tables and comparison
        run: |
          jevbench analyse --replicate-ci 0
          jevbench compare --replicate-ci 0 data/raw/run_live_*.jsonl \
            data/raw/order_study/r1/run_live_20261014T231829Z_jev-1.14.0.jsonl

      - name: They match what is committed
        run: |
          git status --short results
          git diff --exit-code -- results/tables results/comparison \
            ':(exclude)results/comparison/*.png' ':(exclude)*/intervals.csv'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: fail loudly if a .env ever gets tracked, and catch any
      # OpenRouter/TypeSafe-shaped key pasted into a tracked file.
      - name: Assert no env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked — remove it and rotate the key"
            exit 1
          fi
          echo "no tracked .env"

      - name: Assert no API keys in tracked files
        run: |
          if git grep -nIE 'sk-or-v1-[A-Za-z0-9]{32,}|ts-(live|sk)-[A-Za-z0-9]{20,}' -- . ':(exclude).github/workflows/*'; then
            echo "::error::a live API key appears in a tracked file"
            exit 1
          fi
          echo "no API keys found in tracked files"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevbench"
version = "0.1.0"
description = "Do System One models behave like System 1 humans? A behavioural-economics and psychometric battery for TypeSafe's Jev."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "tynamite" }]
keywords = ["behavioral-economics", "llm-evaluation", "psychometrics", "jev", "typesafe"]

dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/tynamite/evaluation-behavioral-system-one"

[project.optional-dependencies]
diagrams = ["playwright>=1.47"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
jevbench = "jevbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001: en dashes and similar are deliberate typography in chart labels and prose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
